version: '3.8'

services:
  ingres-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingres_ai_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./backend/ingres_ai.db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ingresai_production_secret_key_change_me}
      - JWT_ALGORITHM=HS256
      - CORS_ORIGINS=*
    restart: unless-stopped
